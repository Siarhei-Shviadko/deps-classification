{{- if .Values.vault_settings.gcp_secret_manager }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.csi.csi_default_name }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "3"
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/{{ .Values.env }}-db-host/versions/latest" 
        fileName: "database-host"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/{{ .Values.env }}-classification-db-user/versions/latest" 
        fileName: "classification-db-user"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/{{ .Values.env }}-classification-db-password/versions/latest" 
        fileName: "classification-db-password"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/{{ .Values.env }}-classification-db/versions/latest" 
        fileName: "classification-db"
  secretObjects:
    - secretName: {{ .Values.secrets.deps_classification_migrator.secretName }}
      type: Opaque
      data:
      - objectName: "database-host"
        key: database-host
      - objectName: "classification-db-user"
        key: user
      - objectName: "classification-db-password"
        key: password
      - objectName: "classification-db"
        key: database-db
{{- end }}
