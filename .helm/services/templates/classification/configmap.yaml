apiVersion: v1
kind: ConfigMap
metadata:
  name: classification-configmap
  labels:
    {{- include "deps-classification.labels" . | nindent 4 }}
data:
  ENV: {{ .Values.classification_settings.ENV }}
  DATABASE_PORT: '{{ .Values.classification_settings.DATABASE_PORT }}'
  DATABASE_DIALECT: '{{ .Values.classification_settings.DATABASE_DIALECT }}'
  DATABASE_DRIVER: '{{ .Values.classification_settings.DATABASE_DRIVER }}'
  DATABASE_REQUIRE_SECURE_TRANSPORT: '{{ .Values.classification_settings.DATABASE_REQUIRE_SECURE_TRANSPORT }}'

  {{- if .Values.classification_settings.DATABASE_REQUIRE_SECURE_TRANSPORT }}
  DATABASE_SSLKEY: {{ .Values.migration_settings.DATABASE_SSLKEY_PATH }}
  DATABASE_SSLCERT: {{ .Values.migration_settings.DATABASE_SSLCERT_PATH }}
  DATABASE_SSLROOTCERT: {{ .Values.migration_settings.DATABASE_SSLROOTCERT_PATH }}
  {{- end }}

  AUTH_VERIFY_SSL: '{{ .Values.classification_settings.AUTH_VERIFY_SSL }}'

  LOG_LEVEL: '{{ .Values.classification_settings.LOG_LEVEL }}'
  DOCUMENTATION_ENABLED: '{{ .Values.classification_settings.DOCUMENTATION_ENABLED }}'

  KAFKA_GROUP_ID: '{{ .Values.classification_settings.KAFKA_GROUP_ID }}'
  KAFKA_AUTO_OFFSET_RESET: '{{ .Values.classification_settings.KAFKA_AUTO_OFFSET_RESET }}'

  AI_FUSION_URL: '{{ .Values.classification_settings.AI_FUSION_URL }}'
  AI_FUSION_TIMEOUT: '{{ .Values.classification_settings.AI_FUSION_TIMEOUT }}'
  GEN_AI_GROUPING_FACTOR: '{{ .Values.classification_settings.GEN_AI_GROUPING_FACTOR }}'

  {{ if .Values.classification_settings.RABBITMQ_TLS_ENABLED }}
  RABBITMQ_TLS_HOST: '{{ .Values.classification_settings.RABBITMQ_TLS_HOST }}'
  RABBITMQ_TLS_PORT: '{{ .Values.classification_settings.RABBITMQ_TLS_PORT }}'
  RABBITMQ_TLS_USER: '{{ .Values.classification_settings.RABBITMQ_TLS_USER }}'
  RABBITMQ_TLS_VHOST: '{{ .Values.classification_settings.RABBITMQ_TLS_VHOST }}'
  RABBITMQ_TLS_SUBJECT: '{{ .Values.classification_settings.RABBITMQ_TLS_SUBJECT }}'
  RABBITMQ_TLS_CA_CERT: '{{ .Values.classification_settings.RABBITMQ_TLS_CA_CERT }}'
  RABBITMQ_TLS_CLIENT_CERT: '{{ .Values.classification_settings.RABBITMQ_TLS_CLIENT_CERT }}'
  RABBITMQ_TLS_CLIENT_KEY: '{{ .Values.classification_settings.RABBITMQ_TLS_CLIENT_KEY }}'
  {{ end }}

  {{ if .Values.classification_settings.KAFKA_SECURITY_ENABLED }}
  KAFKA_SASL_MECHANISM: '{{ .Values.classification_settings.KAFKA_SASL_MECHANISM }}'
  KAFKA_SECURITY_PROTOCOL: '{{ .Values.classification_settings.KAFKA_SECURITY_PROTOCOL }}'
  {{ end }}
  {{ if .Values.message_broker_asb_without_manage_permission.enabled }}
  ASB_SUBSCRIPTION_STRATEGY: '{{ .Values.classification_settings.ASB_SUBSCRIPTION_STRATEGY }}'
  {{ end }}
  # Telemetry
  INSTRUMENTATION_ENABLED: '{{ .Values.classification_settings.INSTRUMENTATION_ENABLED }}'
  SERVICE_NAME: '{{ .Values.classification_settings.SERVICE_NAME }}'
  EXPORTER_TYPE: '{{ .Values.classification_settings.EXPORTER_TYPE }}'

  # Object storage
  FILE_STORAGE_URL: '{{ .Values.classification_settings.FILE_STORAGE_URL }}'
  OBJECT_STORAGE_MODE: '{{ .Values.classification_settings.OBJECT_STORAGE_MODE }}'
  OBJECT_STORAGE_TYPE: '{{ .Values.classification_settings.OBJECT_STORAGE_TYPE }}'
  # aws
  S3_BUCKET_NAME: '{{ .Values.classification_settings.S3_BUCKET_NAME }}'
  S3_ENDPOINT_URL: '{{ .Values.classification_settings.S3_ENDPOINT_URL }}'
  # gcp
  GCP_BLOB_STORAGE_BUCKET_NAME: '{{ .Values.classification_settings.GCP_BLOB_STORAGE_BUCKET_NAME }}'
