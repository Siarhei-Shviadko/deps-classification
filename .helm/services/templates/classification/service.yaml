apiVersion: v1
kind: Service
metadata:
  name: classification
  labels:
    {{- include "deps-classification.labels" . | nindent 4 }}
spec:
  type: {{ .Values.classification.service.type }}
  ports:
    - port: {{ .Values.classification.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "deps-classification.selectorLabels" . | nindent 4 }}
