apiVersion: apps/v1
kind: Deployment
metadata:
  name: classification
  labels:
    {{- include "deps-classification.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.classification.replicaCount }}
  selector:
    matchLabels:
      {{- include "deps-classification.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "deps-classification.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.classification.imagePullSecrets }}
      imagePullSecrets:
        - name: {{ .Values.classification.imagePullSecrets }}
      {{- end }}
      {{- if .Values.podSecurityContext.runAsNonRoot }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- if or .Values.vault_settings.hashicorp_vault .Values.vault_settings.gcp_secret_manager .Values.vault_settings.aws_secret_manager }}
      serviceAccountName: {{ .Values.service_account.serviceAccountName }}
      {{- end }}
      {{- if .Values.classification_settings.DATABASE_REQUIRE_SECURE_TRANSPORT }}
      initContainers:
        - name: init-classification
          image: busybox
          command: ["sh", "-c", "cp /home/inputdbcerts/* /home/outputdbcerts/ && chmod g-r /home/outputdbcerts/*.key"]
          volumeMounts:
            - name: tls-database-certs
              mountPath: /home/inputdbcerts
            - name: outputdbcerts
              mountPath: /home/outputdbcerts
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: '{{ .Values.registry }}{{ .Values.classification.image.path }}:{{ .Values.classification.image.tag | default "latest" }}'
          imagePullPolicy: {{ .Values.classification.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            {{- toYaml .Values.classification.resources | nindent 12 }}
          envFrom:
          - configMapRef:
              name: classification-configmap
              optional: false
          env:
          {{ if .Values.classification_settings.INSTRUMENTATION_ENABLED }}
          {{ if eq .Values.classification_settings.EXPORTER_TYPE "azure" }}
          - name: APPLICATION_INSIGHTS_CONNECTION_STRING
            valueFrom:
              secretKeyRef:
                name: {{ .Values.secrets.telemetry_secrets.secretName }}
                key: application-insights-connection-string
          {{ end }}
          {{ end }}
          {{- if .Values.vault_settings.enabled }}
          {{- toYaml .Values.classification_vault_enabled.env | nindent 10 }}
          {{ if .Values.classification_settings.RABBITMQ_TLS_ENABLED }}
          - name: RABBITMQ_TLS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: deps-classification
                key: rabbitmq-password
          {{ end }}
          {{ if .Values.classification_settings.KAFKA_SECURITY_ENABLED }}
          - name: KAFKA_SASL_USERNAME
            valueFrom:
              secretKeyRef:
                name: deps-classification
                key: kafka-sasl-username
          - name: KAFKA_SASL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: deps-classification
                key: kafka-sasl-password
          {{ end }}
          {{- else }}
          {{- toYaml .Values.classification_vault_disabled.env | nindent 10 }}
          {{ if .Values.classification_settings.RABBITMQ_TLS_ENABLED }}
          - name: RABBITMQ_TLS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: rabbitmq-password
                key: rabbitmq-password
          {{ end }}
          {{ if .Values.classification_settings.KAFKA_SECURITY_ENABLED }}
          - name: KAFKA_SASL_USERNAME
            valueFrom:
              secretKeyRef:
                name: kafka-secrets
                key: kafka-sasl-username
          - name: KAFKA_SASL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: kafka-secrets
                key: kafka-sasl-password
          {{ end }}
          {{- end }}
          volumeMounts:
          {{- if or .Values.classification_settings.RABBITMQ_TLS_ENABLED .Values.classification_settings.DATABASE_REQUIRE_SECURE_TRANSPORT }}
            {{ if .Values.classification_settings.RABBITMQ_TLS_ENABLED }}
            - name: security-certs
              mountPath: {{ .Values.certs_location.certs_default_path }}
              readOnly: true
            {{ end }}
            {{ if .Values.classification_settings.DATABASE_REQUIRE_SECURE_TRANSPORT }}
            - name: outputdbcerts
              mountPath: {{ .Values.certs_location.database_sslcerts_path }}
            {{ end }}
          {{- end }}
          {{- if .Values.vault_settings.enabled }}
            - name: secrets-store-inline
              mountPath: {{ .Values.secrets_location.secrets_default_path }}
              readOnly: true
          {{- end }}
      volumes:
      {{- if or .Values.classification_settings.RABBITMQ_TLS_ENABLED .Values.classification_settings.DATABASE_REQUIRE_SECURE_TRANSPORT }}
        {{ if .Values.classification_settings.RABBITMQ_TLS_ENABLED }}
        - name: security-certs
          secret:
            secretName: {{ .Values.secrets.security_certs.secretName }}
        {{ end }}
        {{ if .Values.classification_settings.DATABASE_REQUIRE_SECURE_TRANSPORT }}
        - name: tls-database-certs
          secret:
            secretName: {{ .Values.secrets.database_ssl_secret.secretName }}
            items:
            - key: tls.crt
              path: tls.crt
            - key: tls.key
              path: tls.key
              mode: 0600
            - key: root.crt
              path: root.crt
            defaultMode: 0644
        - name: outputdbcerts
          emptyDir: {}
        {{ end }}
      {{- end }}
      {{- if .Values.vault_settings.enabled }}
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.csi.csi_default_name }}
      {{- end }}
      {{- with .Values.classification.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.classification.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.classification.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
