classification:
  image:
    path: "/deps-platform/deps-classification"
  resources: {}

classification_settings:
  ENV: other

  LOG_LEVEL: "INFO"

  DATABASE_REQUIRE_SECURE_TRANSPORT: false

  # Object storage
  S3_BUCKET_NAME: bucket_name
  S3_ENDPOINT_URL: https://s3.us-east-1.amazonaws.com

migration_settings:
  DATABASE_REQUIRE_SECURE_TRANSPORT: false

classification_consumer:
  image:
    path: "/deps-platform/deps-classification"

migrator:
  image:
    path: "/deps-platform/deps-classification-migrator"

helm:
  helm_logs_job_enabled: false

csi:
  vault_namespace: 'k8s-other'
  roleName: 'k8s-other'
  vaultKubernetesMountPath: 'kubernetes-other'

service_account:
  serviceAccountName: 'deps-other'
