[tool.poetry]
name = "deps_classification"
version = "0.1.0"
description = "Classification for Document Type Groups"
authors = []

[tool.poetry.dependencies]
python = "~3.11.9"
dependency-injector = "~4.44.0"
pydantic = "^2.7.0"
pydantic-settings = "^2.2.0"
click = "^8.1.3"
psycopg2-binary = "^2.9.5"
uvicorn = "^0.18.3"
fastapi = "^0.120"
SQLAlchemy = "1.3.12"

deps-message-flow = { path = "../vendors/deps-message-flow/src", extras = ["deps-asb", "deps-kafka", "deps-rabbitmq", "deps-integrations"], develop = true }
deps-observability-instrumentation = { path = "../vendors/deps-observability-instrumentation", develop = true }
deps-object-storage = { path = "../vendors/deps-object-storage", develop = true }
more-itertools = "^10.8.0"

[tool.poetry.group.dev.dependencies]
httpx = "0.28.1"
mypy = "^1.5.1"
bandit = "^1.7.5"
flake8 = ">=3.7,<5"
wemake-python-styleguide = "^0.17.0"
isort = "^5.12.0"
black = "^23.7.0"
pytest = "^7.4.1"
coverage = "^5.5"
factory-boy = "^3.2.0"
pytest-factoryboy = "^2.1.0"
pytest-mock = "^3.6.0"
pytest-unordered = "^0.4.1"
types-requests = "^2.25.6"
wdb = "^3.3.0"
requests-mock = "~1.9.3"

ipdb = "^0.13.9"
see = "^1.4.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.black]
line-length = 120
target-version = ['py39']
exclude = '''
(
    .venv
    | vendors
)
'''
