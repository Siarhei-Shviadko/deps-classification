version: "3.4"

services:
  api:
    build:
      context: .
      dockerfile: ./etc/classification/Dockerfile
      target: develop
      args:
        REPOSITORY_URL: "${REPOSITORY_URL}"
      cache_from:
        - "classification-dev:latest"
    env_file:
      - ./etc/classification/env/.dev.env
      - .env
    networks:
      - deps-network
    volumes:
      - ./src/deps_classification:/app/deps_classification
      - ./src/tests:/app/tests
      - ./src/poetry.lock:/app/poetry.lock
      - ./src/pyproject.toml:/app/pyproject.toml
      - ./vendors:/vendors
      - ./src/setup.cfg:/app/setup.cfg
    ports:
      - "8888:8000"
    environment:
      WDB_SOCKET_SERVER: wdb
      WDB_NO_BROWSER_AUTO_OPEN: "true"
    stdin_open: true
    tty: true

  consumer:
    build:
      context: .
      dockerfile: ./etc/classification/Dockerfile
      target: develop
      args:
        REPOSITORY_URL: "${REPOSITORY_URL}"
      cache_from:
        - "classification-dev:latest"
    env_file:
      - ./etc/classification/env/.dev.env
      - .env
    networks:
      - deps-network
    volumes:
      - ./src/deps_classification:/app/deps_classification
      - ./src/poetry.lock:/app/poetry.lock
      - ./src/pyproject.toml:/app/pyproject.toml
      - ./vendors:/vendors
    environment:
        WDB_SOCKET_SERVER: wdb
        WDB_NO_BROWSER_AUTO_OPEN: "True"
    stdin_open: true
    tty: true

  migrator:
    build:
      context: .
      dockerfile: ./etc/migrator/Dockerfile
      args:
        REPOSITORY_URL: "${REPOSITORY_URL}"
      cache_from:
        - "classification-migrator:latest"
    env_file: ./etc/migrator/env/.dev.env
    networks:
      - deps-network
    volumes:
      - ./etc/migrator/migrations:/app/migrations

networks:
  deps-network:
    external: True
